    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Morning Coffee Labs" />
    <meta property="og:title" content="Fury O Challenge" />
    <meta
      property="og:description"
      content="Think you can beat this Fury O score? Take the challenge."
    />
    <meta property="og:url" content="https://morningcoffeelabs.no/fury-o/challenge/" />

    <meta name="twitter:card" content="summary_large_image" />

      content="Think you can beat this Fury O score? Take the challenge."
    />

    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #02050d;
        color: #f7faff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(111, 231, 255, 0.13), transparent 36%),
          #02050d;
      }

      main {
        width: min(92vw, 560px);
        text-align: center;
        padding: 42px 28px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #6fe7ff;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.18em;
      }

      h1 {
        margin: 0 0 14px;
        color: #ffb000;
        font-size: clamp(42px, 12vw, 72px);
        line-height: 0.95;
        letter-spacing: 0.04em;
      }

      p {
        margin: 0 auto 28px;
        max-width: 420px;
        font-size: 18px;
        line-height: 1.5;
        color: rgba(247, 250, 255, 0.88);
      }

      a {
        display: inline-flex;
        min-height: 56px;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        padding: 0 26px;
        background: #ffb000;
        color: #08111f;
        font-size: 17px;
        font-weight: 900;
        text-decoration: none;
        letter-spacing: 0.04em;
      }

      footer {
        margin-top: 32px;
        color: rgba(247, 250, 255, 0.5);
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <main>
      <div class="eyebrow">MORNING COFFEE LABS</div>
      <h1>FURY O</h1>
      <p>Think you can beat this Fury O score? Take the challenge.</p>
      <a href="https://play.google.com/store/apps/details?id=com.morningcoffeelabs.furyo">
        PLAY FURY O
      </a>
      <footer>© 2026 Morning Coffee Labs</footer>
    </main>
  </body>
</html>
